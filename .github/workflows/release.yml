# Builds the ROM builder for Windows (HL64Builder.exe), Linux (HL64Builder-linux-x86_64.tar.gz) and
# macOS (HL64Builder-macos-arm64.zip, HL64Builder-macos-x86_64.zip) -- see builder/ -- and publishes them as a release.
# A release is made when builder/VERSION changes on main (tag v<VERSION>, made here) or when a
# tag like v1.0 is pushed; "Run workflow" on the Actions tab builds it (download it from the run), and
# with "publish" ticked also replaces the exe in the release for the current builder/VERSION.
name: Release HL64Builder

on:
  push:
    branches: [main]
    paths: ['builder/VERSION']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish it to the release named in builder/VERSION (replaces its HL64Builder.exe)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  N64_INST: /opt/libdragon
  # the versions this port is built and tested with
  LIBDRAGON_COMMIT: 39d0d6096130836a65710da6730290701d060272   # preview branch
  TINY3D_COMMIT: 6f5ac0ba098f86d04e549ea754834f1be3c150e1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe names the version

      - name: Host packages
        timeout-minutes: 10
        run: |
          # the runner's package mirror sometimes hangs: time out and retry instead of waiting forever
          sudo apt-get update -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 || true
          sudo apt-get install -y -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 mingw-w64 libz-mingw-w64-dev python3-pip python3-numpy python3-pil

      - name: N64 toolchain
        run: |
          curl -sSfL -o tc.deb https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          sudo dpkg -i tc.deb
          sudo mkdir -p $N64_INST && sudo chown -R $USER $N64_INST

      - name: libdragon (patched as in README)
        run: |
          git clone -q https://github.com/DragonMinded/libdragon.git $RUNNER_TEMP/libdragon
          cd $RUNNER_TEMP/libdragon
          git checkout -q $LIBDRAGON_COMMIT
          git apply $GITHUB_WORKSPACE/tools/libdragon-rspq-buffer.patch
          make -j$(nproc) install >/dev/null
          make -j$(nproc) tools-install >/dev/null

      - name: tiny3d
        run: |
          git clone -q https://github.com/HailToDodongo/tiny3d.git $RUNNER_TEMP/tiny3d
          cd $RUNNER_TEMP/tiny3d
          git checkout -q $TINY3D_COMMIT
          ./build.sh >/dev/null

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF#refs/tags/}"; else v="v$(tr -d ' \r\n' < builder/VERSION)"; fi
          echo "tag=$v" >> $GITHUB_OUTPUT

      - name: HL64Builder.exe
        run: |
          HL64_VERSION=${{ steps.ver.outputs.tag }}-${GITHUB_SHA::7} T3D_INST=$RUNNER_TEMP/tiny3d LIBDRAGON_SRC=$RUNNER_TEMP/libdragon builder/build_windows.sh
          ls -la builder/out/HL64Builder.exe

      - name: Linux builder
        run: |
          HL64_VERSION=${{ steps.ver.outputs.tag }}-${GITHUB_SHA::7} ENGINE_DIR=builder/out/work/stage/engine LIBDRAGON_SRC=$RUNNER_TEMP/libdragon builder/build_unix.sh linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: HL64Builder-windows
          path: builder/out/HL64Builder.exe
      - uses: actions/upload-artifact@v4
        with:
          name: HL64Builder-linux-x86_64
          path: builder/out/HL64Builder-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4   # the N64 engine, for the Mac packages (no N64 toolchain on a Mac)
        with:
          name: engine
          path: builder/out/work/stage/engine
    outputs:
      tag: ${{ steps.ver.outputs.tag }}

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14       # Apple silicon
            target: macos-arm64
          - runner: macos-15-intel # Intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: ${{ runner.temp }}/engine
      - name: libdragon (for its host tools)
        run: |
          git clone -q https://github.com/DragonMinded/libdragon.git $RUNNER_TEMP/libdragon
          cd $RUNNER_TEMP/libdragon && git checkout -q $LIBDRAGON_COMMIT
      - name: Mac builder
        run: |
          HL64_VERSION=${{ needs.build.outputs.tag }}-${GITHUB_SHA::7} ENGINE_DIR=$RUNNER_TEMP/engine LIBDRAGON_SRC=$RUNNER_TEMP/libdragon builder/build_unix.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: HL64Builder-${{ matrix.target }}
          path: builder/out/HL64Builder-${{ matrix.target }}.zip

  release:
    needs: [build, macos]
    if: always() && needs.build.result == 'success' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HL64Builder-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Half-Life 64 ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            What's new and fixed in this release: see [What's new](https://github.com/${{ github.repository }}#whats-new-in-12) in the README.

            The ROM builder makes the Half-Life 64 ROM (`hl64.z64`) from your own copy of Half-Life. Pick the one for your computer:

            - **Windows:** `HL64Builder.exe`
            - **Linux (x86-64):** `HL64Builder-linux-x86_64.tar.gz` -- extract it and run `HL64Builder`
            - **macOS:** `HL64Builder-macos-arm64.zip` (Apple silicon) or `HL64Builder-macos-x86_64.zip` (Intel) -- unzip it and open `HL64Builder.app`

            1. Install Half-Life on Steam (or have a copy of its `valve` folder).
            2. Run the builder. It finds Half-Life through Steam; if it can't, use **Browse...** to pick your Half-Life folder. Choose where the ROM goes (and, if you like, where the temporary files are kept), then press **Build ROM**.
            3. Wait for it to convert the game (30-90 minutes the first time).

            Play it in ares, gopher64 or simple64 (Expansion Pak on, save type SRAM 256k), or on a 64 MB-capable flashcart.

            The builder contains the N64 engine built from this release's source, libdragon's tools and a private copy of Python. It contains no Valve game data. The ROM it makes does, so keep it for yourself.
            None of the builders is code-signed. Windows: choose "More info", then "Run anyway". macOS: right-click the app and choose Open (or run `xattr -dr com.apple.quarantine HL64Builder.app` in Terminal).
